<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central da Newsletter | Jamildo.com</title>
  <style>
    :root {
      --azul: #024796;
      --laranja: #f83d03;
      --bg: #f4f6f9;
      --texto: #222222;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--texto);
      margin: 0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 680px;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .header {
      border-bottom: 3px solid var(--azul);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }
    h1 {
      color: var(--azul);
      margin: 0 0 6px 0;
      font-size: 24px;
    }
    p.sub {
      color: #666;
      margin: 0;
      font-size: 14px;
    }
    .info-box {
      background: #eef4fc;
      border-left: 4px solid var(--azul);
      padding: 12px 14px;
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .opcao-modo {
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
    }
    label.radio-label {
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .campo {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #333;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--azul);
    }
    .botoes {
      margin-top: 25px;
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-publicar {
      background-color: var(--laranja);
      color: white;
    }
    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 4px;
      display: none;
      font-size: 14px;
    }
    .sucesso { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .erro { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Central da Newsletter | Jamildo.com</h1>
    <p class="sub">Curadoria editorial e disparo diário para a base de leitores</p>
  </div>

  <div class="info-box">
    <strong>Como funciona:</strong> No modo <em>Automático</em>, o robô recolhe os dados direto do Google Analytics. No modo <em>Manual</em>, você cola 5 reportagens do site e ele extrai fotos e linhas finas por conta própria.
  </div>

  <div class="opcao-modo">
    <label class="radio-label">
      <input type="radio" name="modo" value="auto" checked onchange="toggleModo()"> Automático (Top 5 GA4)
    </label>
    <label class="radio-label">
      <input type="radio" name="modo" value="manual" onchange="toggleModo()"> Manual (Colar Links)
    </label>
  </div>

  <div id="links-container" style="display: none;">
    <div class="campo">
      <label>1. Matéria de Capa (Destaque Principal)</label>
      <input type="text" id="link1" placeholder="https://jamildo.com/politica/...">
    </div>
    <div class="campo">
      <label>2. Segundo Destaque</label>
      <input type="text" id="link2" placeholder="https://jamildo.com/...">
    </div>
    <div class="campo">
      <label>3. Terceiro Destaque</label>
      <input type="text" id="link3" placeholder="https://jamildo.com/...">
    </div>
    <div class="campo">
      <label>4. Quarto Destaque</label>
      <input type="text" id="link4" placeholder="https://jamildo.com/...">
    </div>
    <div class="campo">
      <label>5. Quinto Destaque</label>
      <input type="text" id="link5" placeholder="https://jamildo.com/...">
    </div>
  </div>

  <div class="botoes">
    <button class="btn-publicar" id="btnDisparo" onclick="dispararNewsletter()">
      🚀 Disparar Newsletter Agora
    </button>
  </div>

  <div id="status"></div>
</div>

<script>
  // CONFIGURAÇÕES DO GITHUB (Ajuste com os seus dados)
  const GITHUB_USER = "cynaramaira"; 
  const GITHUB_REPO = "newsletter"; 
  const WORKFLOW_FILE = "newsletter.yml"; 
  
  // Token pessoal de acesso com permissão de "workflow"
  // DICA: Você pode criar um Fine-grained Personal Access Token no GitHub só para disparar essa Action
  const GITHUB_TOKEN = "SEU_GITHUB_PAT_AQUI";

  function toggleModo() {
    const isManual = document.querySelector('input[name="modo"]:checked').value === 'manual';
    document.getElementById('links-container').style.display = isManual ? 'block' : 'none';
  }

  async function dispararNewsletter() {
    const modo = document.querySelector('input[name="modo"]:checked').value;
    const statusDiv = document.getElementById('status');
    const btn = document.getElementById('btnDisparo');

    let inputsData = { modo: modo };

    if (modo === 'manual') {
      const l1 = document.getElementById('link1').value.trim();
      const l2 = document.getElementById('link2').value.trim();
      const l3 = document.getElementById('link3').value.trim();
      const l4 = document.getElementById('link4').value.trim();
      const l5 = document.getElementById('link5').value.trim();

      if (!l1 || !l2 || !l3 || !l4 || !l5) {
        statusDiv.className = 'erro';
        statusDiv.style.display = 'block';
        statusDiv.innerHTML = 'Preencha os 5 links para enviar a edição manual.';
        return;
      }
      inputsData.links = `${l1},${l2},${l3},${l4},${l5}`;
    }

    btn.disabled = true;
    btn.innerText = "Enviando comando para o robô...";
    statusDiv.style.display = 'none';

    try {
      const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`, {
        method: "POST",
        headers: {
          "Accept": "application/vnd.github.v3+json",
          "Authorization": `token ${GITHUB_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          ref: "main",
          inputs: inputsData
        })
      });

      if (response.status === 204) {
        statusDiv.className = 'sucesso';
        statusDiv.style.display = 'block';
        statusDiv.innerHTML = '<strong>Ordem enviada com sucesso!</strong> O robô já iniciou o processo de raspagem e os e-mails estão sendo disparados agora.';
      } else {
        const errData = await response.json();
        throw new Error(errData.message || "Falha na requisição");
      }
    } catch (err) {
      statusDiv.className = 'erro';
      statusDiv.style.display = 'block';
      statusDiv.innerHTML = `Erro ao acionar disparo: ${err.message}`;
    } finally {
      btn.disabled = false;
      btn.innerText = "🚀 Disparar Newsletter Agora";
    }
  }
</script>
</body>
</html>
