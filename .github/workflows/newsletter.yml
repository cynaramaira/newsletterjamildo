name: Disparo da Newsletter Jamildo

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de seleção (auto ou manual)'
        required: true
        default: 'auto'
      links:
        description: 'Links manuais (separados por vírgula)'
        required: false
        default: ''

jobs:
  enviar_newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 gspread google-analytics-data

      - name: Executar rotina da newsletter
        env:
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          EMAIL_REMETENTE: "contato@jamildo.com"
          INPUT_MODO: ${{ github.event.inputs.modo || 'auto' }}
          INPUT_LINKS: ${{ github.event.inputs.links || '' }}
        run: python newsletter_producao.py
