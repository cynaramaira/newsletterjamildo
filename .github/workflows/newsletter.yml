name: Disparo da Newsletter Jamildo

on:
  schedule:
    # Disparo programado de segunda a sexta às 18h de Brasília (21h UTC)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de selecao (auto ou manual)'
        required: true
        default: 'auto'
      links:
        description: 'Lista de links separados por virgula'
        required: false
        default: ''

jobs:
  executar-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v3

      - name: Configurar ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: |
          pip install requests beautifulsoup4 google-analytics-data gspread

      - name: Executar rotina de envio
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          INPUT_MODO: ${{ github.event.inputs.modo }}
          INPUT_LINKS: ${{ github.event.inputs.links }}
        run: |
          python newsletter_producao.py
